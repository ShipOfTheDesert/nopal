name: lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

# Cancel any previous runs of this workflow for the same PR.
concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!github.event.pull_request.draft"

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true
          cache-prefix: v1

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: |
            opam install -y odoc.3.1.0

      - uses: ocaml/setup-ocaml/lint-doc@v3

  lint-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!github.event.pull_request.draft"

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true
          cache-prefix: v1

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: |
            opam install -y ocamlformat.0.28.1

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  lint-opam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!github.event.pull_request.draft"

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true
          cache-prefix: v1

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: |
            opam install -y opam-dune-lint

      - uses: ocaml/setup-ocaml/lint-opam@v3

  lint-classes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!github.event.pull_request.draft"

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.46.0'

      # apt is bounded on both axes. Without Acquire::http::Timeout a half-open
      # connection to a mirror blocks forever, and without a noninteractive
      # frontend a debconf prompt blocks on a TTY that does not exist — both
      # observed as jobs that never finish (run 32069072523, this step).
      - name: Install ripgrep
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ripgrep

      - name: Detect recurring bug classes
        run: just lint-classes

      - name: Check E2E specs are wired to a CI project
        run: just check-e2e-wired

      - name: Self-test the shell guards
        run: just selftest-guards
